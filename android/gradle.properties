# --- Escáner de QR (M7 · D21): MLKit EMPAQUETADO, y declarado a propósito -------
# El paquete `mobile_scanner` trae el modelo de MLKit de dos formas: dentro del APK
# (+3-10 MB, funciona sin red) o descargándolo la primera vez desde Google Play
# Services (~600 KB, necesita red y Play Services).
#
# **Se elige la empaquetada, y se escribe aunque hoy sea el valor por defecto.** En
# el INCES la conectividad del aula es irregular: un escáner que descarga su modelo
# la primera vez falla justo el día que la red no va, que es cuando más hace falta.
# Que el alumno pueda marcar sin conexión vale esos megas.
#
# Se declara en vez de confiar en el valor por defecto porque **medimos cómo lo lee
# el paquete** (`android/build.gradle.kts`): usa `toBoolean()` sobre el valor, no
# `hasProperty()`. O sea que `false` significa *empaquetada* — y si el día de mañana
# el paquete cambiara su valor por defecto, esta línea mantiene la decisión.
dev.steenbakker.mobile_scanner.useUnbundled=false
