# INCES LMS — Render Blueprint
# Backend únicamente. Supabase y Cloudflare R2 permanecen como servicios externos.
# Los secretos se cargan desde el Dashboard de Render y no se versionan aquí.

services:
  - type: web
    name: inces-lms-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: inces-lms-media
      - key: R2_PUT_TTL_SEGUNDOS
        sync: false
      - key: R2_GET_TTL_SEGUNDOS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
