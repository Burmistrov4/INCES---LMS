# Suite E2E del frontend (Playwright + Chromium real).
#
# Por qué existe este archivo, y no es «porque toca tener CI»:
#
# 1. La descarga del CSV hacia HACER vive en `package:web` + `dart:js_interop`,
#    que **no compilan en la VM de Dart**. La suite de `flutter test` la dobla y
#    nunca ejecuta el `Blob`, la URL de objeto ni el `<a download>`. Este flujo
#    es el único sitio donde esa ruta se recorre de verdad.
#
# 2. En el sandbox de Windows de desarrollo, `flutter build web` **no arranca**:
#    el CLI de Flutter muere al lanzar su primer proceso hijo (`ERROR_PIPE_BUSY`,
#    `CreateFile failed 231`). En `ubuntu-latest` ese problema no existe, así que
#    compilar aquí es lo que hace que la suite sea ejecutable por cualquiera.
#
# 3. Aquí la versión de Flutter **sí importa**: se fija a 3.47.0, la misma que el
#    proyecto compila y defiende. Un verde con otro toolchain no sería evidencia
#    sobre lo que se entrega.
#
# AVISO: este flujo **falla a propósito** mientras falten los secretos. Un flujo
# que saltara las pruebas y saliera en verde sería peor que un rojo: nadie lo
# miraría, y la deuda de la descarga en navegador real seguiría abierta
# creyéndose cerrada.
#
# NOTA sobre el backend: **hay que levantarlo**, aunque el inicio de sesión no lo
# use. La lista de secciones del panel viene de Fastify
# (`AdminInscripcionesRepository` → `BackendInscripcionGateway`), no de
# Supabase. Sin backend no hay tarjetas, y sin tarjetas no hay botón de exportar.

name: E2E (Playwright)

on:
  # A mano, desde la pestaña Actions: es lo que se usa mientras se pone a punto.
  workflow_dispatch:
  # Y cada noche, para que la deriva de la nube (un esquema que cambia, un
  # secreto que caduca) aparezca sin que nadie tenga que acordarse.
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'lib/**'
      - 'backend/**'
      # `supabase/**` estaba FUERA, y es un agujero medido (2026-10-01): esta
      # suite no sólo prueba el código, prueba **contratos sobre los datos** que
      # la siembra produce —el formato de `documento_identidad`, las columnas del
      # CSV, las secciones con matrículas—. Cambiar `sembrar-datos.mjs` cambia
      # esos datos y **no disparaba nada**: el rojo de `SEM-0003` se descubrió en
      # una corrida que iba por otro motivo, y el arreglo de la cédula habría
      # quedado sin verificar. Una migración también puede cambiar lo que la
      # suite ve, así que el filtro cubre la carpeta entera.
      - 'supabase/**'
      - '.github/workflows/e2e.yml'
      # `pubspec.yaml` y `pubspec.lock` estaban FUERA, y era un agujero medido:
      # este flujo es el ÚNICO que compila el frontend (`flutter build web`), y
      # `flutter_ci.yml` sólo hace `pub get`, `analyze` y `test`. O sea que un
      # cambio de dependencias que rompiera el build web —una versión que no
      # compila para web, un plugin sin implementación web— no disparaba nada y
      # se descubría tarde, cuando alguien tocara `lib/` por otro motivo.
      # Añadir una dependencia ES un cambio que puede romper el build: se paga
      # una corrida de más y se compra que el build web se mire siempre.
      - 'pubspec.yaml'
      - 'pubspec.lock'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # El frontend se sirve en 127.0.0.1 y el backend escucha en 3001. Las dos
  # constantes se usan en varios pasos y tienen que coincidir con lo que recibe
  # el bundle por `--dart-define`, o el navegador llamará a un sitio y el
  # backend escuchará en otro.
  URL_FRONTEND: http://127.0.0.1:8090
  URL_BACKEND: http://127.0.0.1:3001

jobs:
  e2e:
    name: Exportación CSV en navegador real
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      # Se comprueban los secretos ANTES de gastar veinte minutos compilando.
      # Sin esto, un secreto ausente se manifiesta como un error de compilación
      # de Flutter sin relación aparente con la causa, y se pierde el tiempo
      # buscando en el sitio equivocado. Se publica además como anotación, que
      # es pública: los registros del job exigen permisos de administración.
      #
      # `SUPABASE_SERVICE_ROLE_KEY` está en la lista y no es un descuido: el
      # backend la exige para arrancar (`env.ts` la valida sin valor por
      # defecto), y el panel de inscripciones pasa por el backend.
      - name: Comprobar los secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECCION: ${{ secrets.E2E_SECCION }}
        run: |
          faltan=""
          for nombre in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_SECCION; do
            if [ -z "${!nombre}" ]; then
              faltan="$faltan $nombre"
            fi
          done
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan secretos::La suite E2E no puede correr: falta$faltan. Se añaden en Settings > Secrets and variables > Actions. La lista y para qué sirve cada uno está en e2e/README.md."
            exit 1
          fi
          echo "Los seis secretos están presentes."

      - name: Instalar Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      # `.env.json` está en .gitignore y no puede estar en el repositorio, pero
      # el bundle lo necesita: Flutter no lee `.env` en ejecución, resuelve
      # `String.fromEnvironment()` **al compilar**. Sin este paso, la app se
      # construye con la URL de Supabase vacía y falla al iniciar sesión con un
      # error que no menciona la causa.
      #
      # `API_BASE_URL` apunta al backend local del runner, que se levanta más
      # abajo. Si quedara vacío, `ApiClient` lanza al primer uso y el panel no
      # carga.
      - name: Escribir .env.json desde los secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > .env.json <<JSON
          {
            "_comentario": "Generado por .github/workflows/e2e.yml. No se edita a mano.",
            "SUPABASE_URL": "${SUPABASE_URL}",
            "SUPABASE_ANON_KEY": "${SUPABASE_ANON_KEY}",
            "API_BASE_URL": "${URL_BACKEND}"
          }
          JSON

      - name: Compilar el frontend
        run: flutter build web --dart-define-from-file=.env.json

      # Este flujo es el ÚNICO que compila el frontend, y hasta ahora el bundle
      # moría con el runner. Eso dejaba sin salida al caso que más lo necesita:
      # en el equipo de desarrollo `flutter build web` **no arranca**
      # (`CreateFile failed 231`, el VM de Dart no puede crear la tubería de su
      # hijo), así que el `build/web` local se queda congelado en la última vez
      # que alguien pudo compilarlo — y una prueba de navegador contra un bundle
      # viejo mide código que ya no existe. Publicarlo convierte a CI en la
      # fuente de un bundle fresco.
      #
      # Se sube el MISMO directorio que consume la suite (`E2E_WEB_DIR:
      # ../build/web`), así que lo que se descarga es exactamente lo que se
      # acaba de probar, no una reconstrucción parecida.
      #
      # Sin `if: always()` a propósito: si la compilación falla, `build/web`
      # puede quedar a medias y publicar un bundle incompleto es peor que no
      # publicar nada — quien lo descargue creería que mide el código actual.
      - name: Publicar el bundle web
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: build/web/
          retention-days: 7

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar la suite E2E
        working-directory: e2e
        run: npm ci

      # `--with-deps` instala las bibliotecas de sistema que Chromium necesita
      # en un runner limpio; sin ellas el navegador no arranca y el fallo se lee
      # como «no se pudo lanzar el navegador», sin decir qué falta.
      - name: Instalar Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # El backend se compila pero NO se arranca aquí: lo arranca Playwright
      # desde su `webServer`, que además sabe esperar a `/salud` y lo apaga al
      # terminar. Arrancarlo a mano con `&` en un paso funciona hasta que deja
      # de funcionar, y cuando falla el síntoma es «el panel está vacío».
      - name: Compilar el backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Correr la suite
        working-directory: e2e
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ env.URL_FRONTEND }}
          E2E_BACKEND_URL: ${{ env.URL_BACKEND }}
          E2E_WEB_DIR: ../build/web
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SECCION: ${{ secrets.E2E_SECCION }}
          # Las dos credenciales del bucle del aula (M6). Sin ellas
          # `aula_virtual.spec.ts` se **salta** con su propio `test.skip`, y un
          # salto se lee como verde en el resumen: la suite diría «11 passed»
          # mientras cuatro pruebas del aula no corren —que es exactamente lo que
          # pasó en `36963954077`—. Faltaban porque este flujo se escribió antes
          # de que existieran los secretos.
          E2E_ALUMNO_EMAIL: ${{ secrets.E2E_ALUMNO_EMAIL }}
          E2E_ALUMNO_PASSWORD: ${{ secrets.E2E_ALUMNO_PASSWORD }}
          E2E_DOCENTE_EMAIL: ${{ secrets.E2E_DOCENTE_EMAIL }}
          E2E_DOCENTE_PASSWORD: ${{ secrets.E2E_DOCENTE_PASSWORD }}

          # Variables del backend, que hereda el `webServer` de Playwright.
          PORT: '3001'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # **Hay que ponerlo explícitamente.** El valor por defecto del backend
          # es `http://localhost:8090`, y el runner sirve la app en
          # `http://127.0.0.1:8090`. Para el navegador esos son **dos orígenes
          # distintos**, así que el CORS por defecto bloquearía cada llamada del
          # panel — y el fallo se leería como «la lista de secciones está vacía».
          CORS_ORIGINS: ${{ env.URL_FRONTEND }}
        run: npx playwright test

      # El informe HTML es lo que convierte «falló» en «falló aquí, por esto».
      # Se sube siempre, no sólo al fallar: cuando algo pasa a veces, el informe
      # de la corrida que sí pasó también sirve.
      - name: Subir el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: e2e/informe/
          retention-days: 14
          if-no-files-found: warn
